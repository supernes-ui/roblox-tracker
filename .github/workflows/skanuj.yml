name: Skanuj Roblox

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roblox-tracker
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Pobierz pliki repozytorium
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Wykonaj skan
        run: python3 Skaner_GitHub.py

      - name: Zapisz dane i historię
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dane_trackera.json historia_trackera.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Zapisz skan Roblox"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
